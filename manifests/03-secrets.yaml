---
# PLACEHOLDERS ONLY: the shape of the Secrets, never deployed. Do not apply
# this file anywhere real; kustomization.yaml does not list it.
#   make secrets            # writes 03-secrets.local.yaml with random values (gitignored)
#                           # -- that file is what `sc apply -k manifests/` applies
#   sc create secret generic storefront-db --from-literal=...   # or your own
#
# In a real cluster these come from the cluster's secret store -- never from a
# file in git. `stormstorefront validate` refuses a committed value that is
# not a CHANGEME placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: storefront-db
  namespace: storefront
  labels:
    app.kubernetes.io/part-of: storefront
    app.kubernetes.io/component: data
type: Opaque
stringData:
  database-name: CHANGEME-storefront
  database-user: CHANGEME-storefront
  # The store's bearer token: the store requires it on every /v1/ call, the
  # API and the backup sidecar present it.
  database-password: CHANGEME-db-password
---
apiVersion: v1
kind: Secret
metadata:
  name: storefront-cache
  namespace: storefront
  labels:
    app.kubernetes.io/part-of: storefront
    app.kubernetes.io/component: data
type: Opaque
stringData:
  redis-password: CHANGEME-cache-password

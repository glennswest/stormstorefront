---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: storefront
  labels:
    app.kubernetes.io/part-of: storefront
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: storefront
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Per-pod A records for the edge's web backend.
apiVersion: v1
kind: Service
metadata:
  name: web-headless
  namespace: storefront
  labels:
    app.kubernetes.io/part-of: storefront
    app.kubernetes.io/component: web
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: storefront
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: storefront
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: storefront
    app.kubernetes.io/managed-by: sc
  annotations:
    app.openshift.io/connects-to: >-
      [{"apiVersion":"apps/v1","kind":"Deployment","name":"api"}]
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/part-of: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: storefront
    spec:
      serviceAccountName: web
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: web
                    app.kubernetes.io/part-of: storefront
      initContainers:
        # Populates the shared emptyDir before the server starts, so the pod
        # is never briefly serving a 404 for /.
        - name: content-init
          image: stormstorefront
          imagePullPolicy: IfNotPresent
          command: ["/bin/stormstorefront", "content-init"]
          envFrom:
            - configMapRef: { name: web-config }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          volumeMounts:
            - { name: content, mountPath: /srv/www }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits:   { cpu: 100m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
      containers:
        # ---- 1/3: the web server ----------------------------------------
        - name: web
          image: stormstorefront
          imagePullPolicy: IfNotPresent
          command: ["/bin/stormstorefront", "web"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef: { name: web-config }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          volumeMounts:
            - { name: content, mountPath: /srv/www, readOnly: true }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/stormstorefront", "sleep", "8"]
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits:   { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # Unlike the original's nginx, the server writes nothing.
            readOnlyRootFilesystem: true
        # ---- 2/3: keep the static content fresh --------------------------
        - name: content-sync
          image: stormstorefront
          imagePullPolicy: IfNotPresent
          command: ["/bin/stormstorefront", "content-sync"]
          envFrom:
            - configMapRef: { name: web-config }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          volumeMounts:
            - { name: content, mountPath: /srv/www }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits:   { cpu: 100m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
        # ---- 3/3: the server's counters -> Prometheus ---------------------
        - name: exporter
          image: stormstorefront
          imagePullPolicy: IfNotPresent
          command:
            - /bin/stormstorefront
            - exporter
            - --scrape=http://127.0.0.1:8081/stub_status
            - --listen=:9113
            - --prefix=storefront_web
          ports:
            - name: metrics
              containerPort: 9113
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 2
            periodSeconds: 20
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits:   { cpu: 100m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
      volumes:
        # Written by content-init/content-sync, read by the server.
        - name: content
          emptyDir:
            sizeLimit: 32Mi

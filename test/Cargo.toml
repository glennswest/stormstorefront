[package]
name = "stormstorefront-test"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "stormstorefront's test container: /test short|medium|long, per stormcentral docs/test-standard.md. Deploys the storefront into its own project on a running node, proves it, and tears it down."
publish = false

[[bin]]
name = "stormstorefront-test"
path = "src/main.rs"

[dependencies]
stormstorefront = { path = ".." }
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[lints.rust]
warnings = "deny"

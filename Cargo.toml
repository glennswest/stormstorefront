[package]
name = "stormstorefront"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The storefront reference app on stormcos: one static binary, every container's role by argument (edge, web, api, store, cache, their sidecars and init containers)."
publish = false

[workspace]
members = [".", "test"]
# `cargo build` / `cargo test` at the root (sc-build, the image build) build
# the app only; the test container is built by test/build.sh.
default-members = ["."]

[lib]
name = "storefront"
path = "src/lib.rs"

[[bin]]
name = "stormstorefront"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[lints.rust]
warnings = "deny"
